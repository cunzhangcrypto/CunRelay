[project]
name = "cunrelay"
version = "0.1.0"
description = "CunRelay - YouTube 内容自动发现 + AI 处理 + 多平台自动分发"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "PyYAML>=6.0.0",
    "feedparser>=6.0.0",
    "youtube-transcript-api>=1.0.0",
    "requests-oauthlib>=2.0.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pytz>=2024.0",
]

[project.scripts]
cunrelay = "cunrelay.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cunrelay"]
